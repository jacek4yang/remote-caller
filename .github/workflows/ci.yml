name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@bc2d2e71bd35c5549942babaa51a89c586b981d1 # v2.8.1
      - name: Check Rust formatting
        run: |
          cargo fmt --all -- --check
          cargo fmt --manifest-path vendor/turn-server/Cargo.toml --all -- --check
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo test --locked --all-features
      - run: cargo build --locked --release
      - name: Validate browser and shell syntax
        run: |
          node --check web/app.js
          node --check web/sw.js
          bash -n scripts/build-release.sh
          bash -n scripts/test-production-wsl.sh
      - name: Validate systemd unit
        run: |
          sudo useradd --system --home /opt/remote-caller --shell /usr/sbin/nologin remote-caller
          sudo install -d /opt/remote-caller/bin /etc/remote-caller
          sudo install -m 0755 /bin/true /opt/remote-caller/bin/remote-caller
          sudo install -m 0600 deploy/systemd/remote-caller.env.example /etc/remote-caller/remote-caller.env
          systemd-analyze verify deploy/systemd/remote-caller.service
      - name: Validate Nginx configuration
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends nginx
          sudo install -d /etc/letsencrypt/live/call.example.com /var/www/letsencrypt
          sudo openssl req -x509 -newkey rsa:2048 -nodes -days 1 \
            -subj /CN=call.example.com \
            -keyout /etc/letsencrypt/live/call.example.com/privkey.pem \
            -out /etc/letsencrypt/live/call.example.com/fullchain.pem
          sudo install -m 0644 deploy/nginx/remote-caller.conf /etc/nginx/conf.d/remote-caller.conf
          sudo nginx -t
      - name: Ensure production secrets are not tracked
        shell: bash
        run: |
          matches=$(git grep -nE 'BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY|ghp_[A-Za-z0-9]{30,}|github_pat_[A-Za-z0-9_]{30,}|AKIA[0-9A-Z]{16}|JWT_SECRET=[A-Za-z0-9+/=_-]{32,}|TURN_SECRET=[A-Za-z0-9+/=_-]{32,}' -- . || true)
          unexpected=$(printf '%s\n' "$matches" | grep -Ev 'REPLACE_WITH|integration-(jwt|turn)-secret' || true)
          test -z "$unexpected" || { printf '%s\n' "$unexpected"; exit 1; }

  dependency-audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
