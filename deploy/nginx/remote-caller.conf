map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

limit_req_zone $binary_remote_addr zone=remote_caller_login:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=remote_caller_ticket:10m rate=30r/m;
limit_conn_zone $binary_remote_addr zone=remote_caller_conn:10m;

upstream remote_caller_backend {
    server 127.0.0.1:8080 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name call.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name call.example.com;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/call.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/call.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    root /var/www/remote-caller/web;
    index index.html;

    client_max_body_size 8k;
    limit_conn remote_caller_conn 20;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self' wss:; media-src 'self' blob:; object-src 'none'; base-uri 'none'; frame-ancestors 'none'" always;

    location = /api/login {
        client_max_body_size 4k;
        limit_req zone=remote_caller_login burst=5 nodelay;
        proxy_pass http://remote_caller_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    location = /api/ws-ticket {
        client_max_body_size 4k;
        limit_req zone=remote_caller_ticket burst=10 nodelay;
        proxy_pass http://remote_caller_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    location /api/ {
        proxy_pass http://remote_caller_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    location = /ws {
        # The URL carries only a short-lived one-time ticket. Keep logs off to
        # avoid leaking even that ticket to log aggregation systems.
        access_log off;
        proxy_pass http://remote_caller_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        # Rust sends a WebSocket Ping every 20s, so healthy calls remain active
        # indefinitely while dead paths are still detected promptly.
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    location ~ ^/health/(live|ready)$ {
        proxy_pass http://remote_caller_backend;
        access_log off;
    }

    location = /metrics {
        proxy_pass http://remote_caller_backend;
        allow 127.0.0.1;
        allow ::1;
        deny all;
    }

    location = /index.html {
        expires -1;
        try_files $uri =404;
    }

    location = /sw.js {
        expires -1;
        try_files $uri =404;
    }

    location ~* \.(?:css|js|svg|webmanifest)$ {
        expires 7d;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
